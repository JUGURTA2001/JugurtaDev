<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JugurtaDev — Login</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Sélecteur de langue (FR / EN uniquement) -->
  <div class="lang-switch">
    <button type="button" class="lang-icon-btn" id="lang-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Choose language">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3c2.5 2.5 4 5.7 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.7-4-9s1.5-6.5 4-9z"/>
      </svg>
    </button>
    <ul class="lang-menu" id="lang-menu">
      <li><button type="button" data-lang="en" class="active">English</button></li>
      <li><button type="button" data-lang="fr">Français</button></li>
    </ul>
  </div>

  <!-- Carte de connexion -->
  <div class="card">
    <div class="brand">
      <img class="mark" src="photo.jpg" alt="Profile photo" />
      <h1 data-i18n="title">JugurtaDev</h1>
      <p data-i18n="subtitle">Sign in to your account</p>
    </div>

    <!-- Continuer avec Google -->
    <button type="button" class="google-btn" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/>
        <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C41.4 35.9 44 30.3 44 24c0-1.3-.1-2.7-.4-3.5z"/>
      </svg>
      <span data-i18n="googleBtn">Continue with Google</span>
    </button>

    <div class="divider" data-i18n="orDivider">or</div>

    <form id="login-form" novalidate>
      <!-- Champ Email -->
      <div class="field" id="field-email">
        <label for="email" data-i18n="emailLabel">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" />
        <div class="field-error" data-i18n="emailError">Enter a valid email address.</div>
      </div>

      <!-- Champ Mot de passe avec œil + lien "mot de passe oublié" -->
      <div class="field" id="field-password">
        <div class="field-label-row">
          <label for="password" data-i18n="passwordLabel">Password</label>
          <a href="forgot-password.html" class="forgot-link" data-i18n="forgotLink">Forgot password?</a>
        </div>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="" />
          <button type="button" class="toggle-password" aria-label="Show password" tabindex="-1">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <div class="field-error" data-i18n="passwordError">Password must be at least 6 characters.</div>
      </div>

      <button type="submit" class="submit-btn" data-i18n="loginBtn">Sign in</button>
      <div class="status-msg" id="status-msg"></div>
    </form>

    <div class="divider" data-i18n="orDivider">or</div>
    <button type="button" class="account-btn" id="account-btn" data-i18n="accountBtn">Create / manage account</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
