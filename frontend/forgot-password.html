<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JugurtaDev — Forgot Password</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="brand">
    <img class="mark" src="photo.jpg" alt="Profile photo">
    <h1>JugurtaDev</h1>
    <p id="fp-subtitle">Reset your password</p>
  </div>

  <form id="forgot-form" novalidate>
    <div class="field" id="field-email">
      <label for="email" id="fp-email-label">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com">
      <div class="field-error" id="fp-email-error">Enter a valid email address.</div>
    </div>

    <button type="submit" class="submit-btn" id="fp-submit-btn">Send reset link</button>
    <div class="status-msg" id="status-msg"></div>
  </form>

  <div class="divider">or</div>
  <button type="button" class="account-btn" id="back-btn">Back to sign in</button>
</div>

<script src="forgot-password.js"></script>
</body>
</html>
